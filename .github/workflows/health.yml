name: Health check

# Daily check that the site and the live data source are up and valid. A failing run notifies the maintainer.

on:
    schedule:
        - cron: "30 6 * * *"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    health:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
            - name: Site answers
              run: curl --fail --silent --show-error --location https://mrsweeter.github.io/glowing-modules/ | grep -q '<title>'
            - name: Live data is reachable and valid
              run: node scripts/pull-data.mjs --out "$RUNNER_TEMP/live.json"
