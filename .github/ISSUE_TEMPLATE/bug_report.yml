name: Bug report
description: Something in the app does not work as expected.
labels: [bug]
body:
    - type: textarea
      id: what
      attributes:
          label: What happened?
          description: What did you do, what did you see?
      validations:
          required: true
    - type: textarea
      id: expected
      attributes:
          label: What did you expect?
      validations:
          required: true
    - type: input
      id: url
      attributes:
          label: Link to the view
          description: Use the "Copy link" button in the header (it includes the versions and the search).
          placeholder: https://mrsweeter.github.io/glowing-modules/?from=17.0&to=18.0&q=account
    - type: dropdown
      id: browser
      attributes:
          label: Browser
          options: [Chrome / Edge, Firefox, Safari, Safari (iOS), Chrome (Android), Other]
      validations:
          required: true
    - type: input
      id: os
      attributes:
          label: Operating system
          placeholder: macOS 15, Windows 11, Ubuntu 24.04, iOS 18…
    - type: textarea
      id: screenshots
      attributes:
          label: Screenshots or console errors
